name: Update papers

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC (06:00 UK summer time)
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to search (use 30 for a first backfill)"
        required: false
        default: "3"
  push:
    branches: [main]
    paths: ["salman-paper-radar/site/**", "salman-paper-radar/config.yaml", "salman-paper-radar/data/manual.json", "salman-paper-radar/scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

# The project files live in the "salman-paper-radar" folder of this repository.
defaults:
  run:
    working-directory: salman-paper-radar

concurrency:
  group: paper-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Refresh the Q1 journal list (monthly, from SCImago)
        run: python scripts/update_q1.py
      - name: Collect new papers
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_papers.py --days "${{ github.event.inputs.days || '3' }}"
      - name: Save the archive
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/papers.js
          [ -f data/q1_journals.json ] && git add data/q1_journals.json
          if ! git diff --cached --quiet; then
            git commit -m "Papers update $(date -u +%F)"
            git pull --rebase origin main   # in case you edited files on GitHub while the job ran
            git push
          fi
      - name: Build site folder
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/papers.json data/papers.js _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: salman-paper-radar/_site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
