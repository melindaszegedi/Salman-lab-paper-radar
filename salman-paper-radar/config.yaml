# Optional: short "why it matters" notes and relevance scores written by Claude.
# Only runs if the ANTHROPIC_API_KEY secret is set. Costs a little per paper.
llm:
  model: "claude-haiku-4-5-20251001"
  max_papers_per_run: 40
  lab_profile: >-
    Prof. Mootaz Salman's lab (University of Oxford, DPAG / Kavli Institute) studies cerebral small vessel
    disease, the blood-brain barrier, aquaporin-4 and glymphatic clearance, and builds humanised in vitro
    BBB models (iPSC-derived tricultures, MIMETAS OrganoPlate with OrganoTEER, Transwell TEER). Current
    projects include TEER-validated 3D iPSC BBB models, transferrin-receptor brain-shuttle antibodies, and
    drug discovery for Alzheimer's disease with the ARUK Oxford Drug Discovery Institute.
